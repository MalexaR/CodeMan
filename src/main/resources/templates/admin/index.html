<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMan | Admin</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/accessibility.css}">
</head>
<body>

<a class="skip-link" href="#main-content">Saltar al contenido principal</a>

<header class="topbar">
    <a class="brand" th:href="@{/}">← Inicio</a>
    <nav class="admin-tabs" aria-label="Secciones de administración">
        <a class="tab-link active" th:href="@{/admin}">Panel</a>
        <a class="tab-link" th:href="@{/admin/patrones}">Patrones</a>
        <a class="tab-link" th:href="@{/admin/preguntas}">Preguntas</a>
    </nav>
</header>

<main id="main-content" class="container">

    <header class="page-title">
        <p class="eyebrow">Rol administrador</p>
        <h1>Panel de administración</h1>
        <p>Gestión de contenido académico: fichas teóricas y banco de preguntas.</p>
    </header>

    <nav aria-label="Secciones de administración">
        <ul class="grid cards-grid three" role="list">
            <li>
                <div class="menu-card blue">
                    <span class="card-icon" aria-hidden="true">👥</span>
                    <h2>Usuarios</h2>
                    <p th:text="|${totalUsuarios} usuarios registrados|"></p>
                </div>
            </li>
            <li>
                <a class="menu-card green" th:href="@{/admin/patrones}">
                    <span class="card-icon" aria-hidden="true">📚</span>
                    <h2>Patrones</h2>
                    <p th:text="|${totalPatrones} patrones registrados|"></p>
                    <span class="card-arrow" aria-hidden="true">→</span>
                </a>
            </li>
            <li>
                <a class="menu-card amber" th:href="@{/admin/preguntas}">
                    <span class="card-icon" aria-hidden="true">❔</span>
                    <h2>Preguntas</h2>
                    <p th:text="|${totalPreguntas} preguntas registradas|"></p>
                    <span class="card-arrow" aria-hidden="true">→</span>
                </a>
            </li>
        </ul>
    </nav>

</main>
<script th:src="@{/js/accessibility.js}"></script>
</body>
</html>
