<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CodeMan | Laberinto</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body class="game-body">
<header class="topbar"><a class="brand" th:href="@{/jugar}">← Volver</a><strong class="neon-title">CodeMan — Laberinto</strong><span th:text="${usuario.name}"></span></header>
<main class="game-container" th:data-categoria="${categoria}">
    <section class="hud">
        <div>❤️ Vidas: <strong id="vidas">3</strong></div>
        <div>⭐ Puntos: <strong id="puntos">0</strong></div>
        <div>⏱️ Tiempo: <strong id="tiempo">0</strong>s</div>
        <div>👻 Errores: <strong id="errores">0</strong></div>
    </section>
    <canvas id="mazeCanvas" width="588" height="588" aria-label="Laberinto CodeMan"></canvas>

    <!-- Controles táctiles (solo visibles en móvil) -->
    <div class="dpad" id="dpad" aria-label="Controles direccionales">
        <button class="dpad-btn dpad-up"   aria-label="Arriba">▲</button>
        <div class="dpad-middle">
            <button class="dpad-btn dpad-left"  aria-label="Izquierda">◀</button>
            <div class="dpad-center"></div>
            <button class="dpad-btn dpad-right" aria-label="Derecha">▶</button>
        </div>
        <button class="dpad-btn dpad-down" aria-label="Abajo">▼</button>
    </div>
    <button class="mobile-pause-btn" id="pauseBtn">⏸ Pausa</button>

    <p class="game-help">Flechas / WASD para mover · P para pausar · Responde antes de que acabe el tiempo</p>
</main>

<div id="questionModal" class="modal hidden">
    <div class="modal-card">
        <div class="modal-head"><h2>Pregunta de código</h2><span id="questionTimer">20</span></div>
        <p id="questionText"></p>
        <div id="answers" class="answers"></div>
    </div>
</div>

<div id="endModal" class="modal hidden">
    <div class="modal-card center">
        <h2 id="endTitle">Fin del juego</h2>
        <p id="endMessage"></p>
        <a class="btn primary" th:href="@{/jugar}">Elegir otra categoría</a>
        <a class="btn outline" th:href="@{/progreso}">Ver progreso</a>
    </div>
</div>
<script th:src="@{/js/scorm-bridge.js}"></script>
<script th:src="@{/js/maze-game.js}"></script>
</body></html>
