<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMan | Laberinto</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="game-body">

<a class="skip-link" href="#main-content">Saltar al contenido principal</a>

<header class="topbar">
    <a class="brand" th:href="@{/jugar}">← Volver</a>
    <strong class="neon-title">CodeMan — Laberinto</strong>
    <div class="userbar"><span th:text="${usuario.name}"></span></div>
</header>

<main id="main-content" class="game-container" th:data-categoria="${categoria}">

    <section class="hud" aria-label="Estado del juego">
        <div><span aria-hidden="true">❤️</span> Vidas: <strong id="vidas" aria-live="polite">3</strong></div>
        <div><span aria-hidden="true">⭐</span> Puntos: <strong id="puntos" aria-live="polite">0</strong></div>
        <div><span aria-hidden="true">⏱️</span> Tiempo: <strong id="tiempo" aria-live="polite">0</strong>s</div>
        <div><span aria-hidden="true">👻</span> Errores: <strong id="errores" aria-live="polite">0</strong></div>
    </section>

    <canvas id="mazeCanvas" width="588" height="588"
            role="img" aria-label="Laberinto CodeMan — usa las flechas o el D-pad para mover a Pac-Man"></canvas>

    <div class="dpad" id="dpad" aria-label="Controles direccionales">
        <button class="dpad-btn dpad-up" aria-label="Arriba" type="button">▲</button>
        <div class="dpad-middle" role="group" aria-label="Izquierda y derecha">
            <button class="dpad-btn dpad-left" aria-label="Izquierda" type="button">◀</button>
            <div class="dpad-center" aria-hidden="true"></div>
            <button class="dpad-btn dpad-right" aria-label="Derecha" type="button">▶</button>
        </div>
        <button class="dpad-btn dpad-down" aria-label="Abajo" type="button">▼</button>
    </div>
    <button class="mobile-pause-btn" id="pauseBtn" type="button" aria-pressed="false">
        <span aria-hidden="true">⏸</span> Pausa
    </button>

    <p class="game-help">Flechas / WASD para mover · P para pausar · Responde antes de que acabe el tiempo</p>

</main>

<div id="questionModal" class="modal hidden"
     role="dialog" aria-modal="true" aria-labelledby="questionModalTitle" aria-describedby="questionText">
    <div class="modal-card">
        <header class="modal-head">
            <h2 id="questionModalTitle">Pregunta de código</h2>
            <span id="questionTimer" aria-live="assertive" aria-label="Tiempo restante">20</span>
        </header>
        <p id="questionText"></p>
        <div id="answers" class="answers" role="group" aria-label="Opciones de respuesta"></div>
    </div>
</div>

<div id="endModal" class="modal hidden"
     role="dialog" aria-modal="true" aria-labelledby="endTitle" aria-describedby="endMessage">
    <div class="modal-card center">
        <h2 id="endTitle">Fin del juego</h2>
        <p id="endMessage"></p>
        <a class="btn primary" th:href="@{/jugar}">Elegir otra categoría</a>
        <a class="btn outline" th:href="@{/progreso}">Ver progreso</a>
    </div>
</div>

<script th:src="@{/js/scorm-bridge.js}"></script>
<script th:src="@{/js/maze-game.js}"></script>
</body>
</html>
