<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMan | Desafío Final</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="game-body">

<a class="skip-link" href="#main-content">Saltar al contenido principal</a>

<header class="topbar">
    <a class="brand" th:href="@{/jugar}">← Volver</a>
    <strong class="neon-title">CodeMan — Desafío Final</strong>
    <span th:text="${usuario.name}"></span>
</header>

<main id="main-content" class="desafio-container">

    <section class="hud" aria-label="Estado del desafío final">
        <div><span aria-hidden="true">❤️</span> Vidas: <strong id="vidas" aria-live="polite">3</strong></div>
        <div><span aria-hidden="true">⭐</span> Puntos: <strong id="puntos" aria-live="polite">0</strong></div>
        <div><span aria-hidden="true">⏱️</span> Tiempo: <strong id="tiempo" aria-live="polite">30:00</strong></div>
        <div><span aria-hidden="true">👻</span> Errores: <strong id="errores" aria-live="polite">0</strong></div>
    </section>

    <canvas id="desafio-canvas" width="588" height="588"
            role="img" aria-label="Laberinto Desafío Final CodeMan — usa las flechas o WASD para mover a Pac-Man"></canvas>

    <p class="game-help">Usa flechas o WASD. Presiona P para pausar. ESC para abandonar. Necesitas ≥60% de aciertos para completar el desafío.</p>

</main>

<div id="questionModal" class="modal hidden"
     role="dialog" aria-modal="true" aria-labelledby="questionModalTitleD" aria-describedby="questionText">
    <div class="modal-card">
        <header class="modal-head">
            <h2 id="questionModalTitleD">Pregunta de código</h2>
            <span id="questionTimer" aria-live="assertive" aria-label="Tiempo restante">20</span>
        </header>
        <p id="questionText"></p>
        <div id="answers" class="answers" role="group" aria-label="Opciones de respuesta"></div>
    </div>
</div>

<script th:src="@{/js/scorm-bridge.js}"></script>
<script th:src="@{/js/desafio-game.js}"></script>
</body>
</html>
