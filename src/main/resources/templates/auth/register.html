<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMan | Registro</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/accessibility.css}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="apple-touch-icon" th:href="@{/images/icon.svg}">
    <meta name="theme-color" content="#22c55e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="CodeMan">
</head>
<body class="auth-body">

<a class="skip-link" href="#main-content">Saltar al contenido principal</a>

<main id="main-content">
    <section class="auth-shell" aria-label="Registro en CodeMan">

        <aside class="brand-panel" aria-label="Acerca de CodeMan">
            <div class="pacman-logo" aria-hidden="true"><span></span></div>
            <h1>Registro seguro</h1>
            <p>Crea tu cuenta de estudiante para acceder al módulo teórico, jugar y medir tu progreso.</p>
            <figure class="code-card">
                <code>new Student().play(CodeMan);</code>
            </figure>
        </aside>

        <section class="auth-card" aria-labelledby="register-heading">
            <h2 id="register-heading">Crear cuenta</h2>
            <p class="muted">Usa un correo institucional válido.</p>

            <form th:action="@{/register}" th:object="${registerForm}" method="post" class="form-stack" novalidate>
                <div class="alert error" role="alert"
                     th:if="${#fields.hasGlobalErrors()}"
                     th:each="err : ${#fields.globalErrors()}"
                     th:text="${err}"></div>

                <label for="name">Nombre completo</label>
                <input type="text" th:field="*{name}"
                       placeholder="Tu nombre"
                       autocomplete="name" required>
                <small class="field-error" role="alert"
                       th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}"></small>

                <label for="email">Correo institucional</label>
                <input type="email" th:field="*{email}"
                       placeholder="tu.correo@unillanos.edu.co"
                       autocomplete="email" required>
                <small class="field-error" role="alert"
                       th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}"></small>

                <label for="password">Contraseña</label>
                <input type="password" th:field="*{password}"
                       placeholder="Mínimo 8 caracteres, letras y números"
                       autocomplete="new-password" required>
                <small class="field-error" role="alert"
                       th:if="${#fields.hasErrors('password')}"
                       th:errors="*{password}"></small>

                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" th:field="*{confirmPassword}"
                       placeholder="Repite tu contraseña"
                       autocomplete="new-password" required>
                <small class="field-error" role="alert"
                       th:if="${#fields.hasErrors('confirmPassword')}"
                       th:errors="*{confirmPassword}"></small>

                <button type="submit" class="btn primary full">Crear cuenta</button>
            </form>

            <p class="center muted small">¿Ya tienes cuenta? <a th:href="@{/login}">Iniciar sesión</a></p>
        </section>

    </section>
</main>
<script th:src="@{/js/accessibility.js}"></script>
</body>
</html>
