<svg width="680" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
      <path d="M1 1 L13 6 L1 11Z" fill="white" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L9 4 L0 8Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="300" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Adapter</text>

  <!-- Cliente -->
  <rect x="20" y="115" width="100" height="30" rx="3" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="70" y="135" text-anchor="middle" font-size="12" fill="#78350f">Cliente</text>

  <!-- Target (interface) -->
  <rect x="175" y="80" width="185" height="46" fill="#ede9fe" stroke="#64748b" stroke-width="1.5"/>
  <text x="268" y="98" text-anchor="middle" font-size="10" font-style="italic" fill="#6d28d9">&#171;interface&#187;</text>
  <text x="268" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">Target</text>
  <rect x="175" y="126" width="185" height="4" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <rect x="175" y="130" width="185" height="28" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="187" y="148" font-size="11" fill="#374151">+ solicitud() : void</text>

  <!-- Adapter -->
  <rect x="175" y="210" width="185" height="30" fill="#bfdbfe" stroke="#64748b" stroke-width="1.5"/>
  <text x="268" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Adapter</text>
  <rect x="175" y="240" width="185" height="4" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <rect x="175" y="244" width="185" height="28" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="187" y="262" font-size="11" fill="#374151">+ solicitud() : void</text>

  <!-- Adaptee -->
  <rect x="470" y="210" width="185" height="30" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="563" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">Adaptee</text>
  <rect x="470" y="240" width="185" height="4" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <rect x="470" y="244" width="185" height="28" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="482" y="262" font-size="11" fill="#374151">+ metodoExistente() : void</text>

  <!-- Arrow: Cliente → Target -->
  <line x1="120" y1="130" x2="173" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow: Adapter → Target (realization, dashed) -->
  <line x1="268" y1="210" x2="268" y2="158" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#tri)"/>

  <!-- Arrow: Adapter → Adaptee (association) -->
  <line x1="360" y1="255" x2="468" y2="255" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="412" y="248" text-anchor="middle" font-size="9" fill="#64748b">delega</text>
</svg>
