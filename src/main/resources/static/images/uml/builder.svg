<svg width="700" height="390" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
      <path d="M1 1 L13 6 L1 11Z" fill="white" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L9 4 L0 8Z" fill="#64748b"/>
    </marker>
    <marker id="dep" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 1 L8 4 L0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="700" height="390" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>
  <text x="350" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Builder</text>

  <!-- Director -->
  <rect x="20" y="95" width="165" height="30" fill="#bfdbfe" stroke="#64748b" stroke-width="1.5"/>
  <text x="103" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Director</text>
  <rect x="20" y="125" width="165" height="4" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <rect x="20" y="129" width="165" height="28" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="32" y="147" font-size="11" fill="#374151">+ construir(b: Builder)</text>

  <!-- Builder (interface) -->
  <rect x="265" y="55" width="240" height="46" fill="#ede9fe" stroke="#64748b" stroke-width="1.5"/>
  <text x="385" y="73" text-anchor="middle" font-size="10" font-style="italic" fill="#6d28d9">&#171;interface&#187;</text>
  <text x="385" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">Builder</text>
  <rect x="265" y="101" width="240" height="4" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <rect x="265" y="105" width="240" height="68" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="277" y="123" font-size="11" fill="#374151">+ buildParteA() : void</text>
  <text x="277" y="143" font-size="11" fill="#374151">+ buildParteB() : void</text>
  <text x="277" y="163" font-size="11" fill="#374151">+ getResultado() : Producto</text>

  <!-- BuilderConcreto -->
  <rect x="265" y="278" width="240" height="30" fill="#bfdbfe" stroke="#64748b" stroke-width="1.5"/>
  <text x="385" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">BuilderConcreto</text>
  <rect x="265" y="308" width="240" height="4" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <rect x="265" y="312" width="240" height="68" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="277" y="330" font-size="11" fill="#374151">+ buildParteA() : void</text>
  <text x="277" y="350" font-size="11" fill="#374151">+ buildParteB() : void</text>
  <text x="277" y="370" font-size="11" fill="#374151">+ getResultado() : Producto</text>

  <!-- Producto -->
  <rect x="580" y="278" width="108" height="30" fill="#bfdbfe" stroke="#64748b" stroke-width="1.5"/>
  <text x="634" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Producto</text>
  <rect x="580" y="308" width="108" height="4" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <rect x="580" y="312" width="108" height="48" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="592" y="330" font-size="11" fill="#374151">&#8211; parteA</text>
  <text x="592" y="350" font-size="11" fill="#374151">&#8211; parteB</text>

  <!-- Arrow: Director → Builder (association) -->
  <line x1="185" y1="133" x2="263" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow: BuilderConcreto → Builder (realization, dashed) -->
  <line x1="385" y1="278" x2="385" y2="173" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#tri)"/>

  <!-- Arrow: BuilderConcreto → Producto (creates, dashed) -->
  <line x1="505" y1="340" x2="578" y2="320" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#dep)"/>
  <text x="538" y="325" font-size="9" fill="#64748b">&#171;creates&#187;</text>
</svg>
