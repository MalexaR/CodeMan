  <text x="335" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">Componente</text>
  <rect x="225" y="96" width="220" height="4" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <rect x="225" y="100" width="220" height="28" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="237" y="118" font-size="11" fill="#374151">+ operacion() : void</text>

  <!-- ComponenteConcreto - bottom left -->
  <rect x="40" y="250" width="200" height="30" fill="#bfdbfe" stroke="#64748b" stroke-width="1.5"/>
  <text x="140" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">ComponenteConcreto</text>
  <rect x="40" y="280" width="200" height="4" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <rect x="40" y="284" width="200" height="28" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="52" y="302" font-size="11" fill="#374151">+ operacion() : void</text>

  <!-- Decorador (abstract) - bottom center -->
  <rect x="285" y="230" width="220" height="46" fill="#e0e7ff" stroke="#64748b" stroke-width="1.5"/>
  <text x="395" y="248" text-anchor="middle" font-size="10" font-style="italic" fill="#6d28d9">&#171;abstract&#187;</text>
  <text x="395" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">Decorador</text>
  <rect x="285" y="276" width="220" height="28" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="297" y="294" font-size="11" fill="#374151">&#8211; componente: Componente</text>
  <rect x="285" y="304" width="220" height="28" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="297" y="322" font-size="11" fill="#374151">+ operacion() : void</text>

  <!-- DecoradorConcreto - bottom right -->
  <rect x="285" y="355" width="220" height="30" fill="#bfdbfe" stroke="#64748b" stroke-width="1.5"/>
