  <rect x="395" y="385" width="1" height="1" fill="none"/>

  <!-- Arrow: ComponenteConcreto → Componente (realization, dashed) -->
  <line x1="140" y1="250" x2="270" y2="128" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#tri)"/>

  <!-- Arrow: Decorador → Componente (realization, dashed) -->
  <line x1="395" y1="230" x2="395" y2="128" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#tri)"/>

  <!-- Arrow: Decorador has-a Componente (association, curves back) -->
  <path d="M505 290 Q580 290 580 85 Q580 68 447 68" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="578" y="185" font-size="9" fill="#64748b" text-anchor="middle">componente</text>

  <!-- Arrow: DecoradorConcreto → Decorador (generalization) -->
  <line x1="395" y1="355" x2="395" y2="332" stroke="#64748b" stroke-width="1.5" marker-end="url(#tri)"/>
