<svg width="680" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
      <path d="M1 1 L13 6 L1 11Z" fill="white" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L9 4 L0 8Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Decorator</text>

  <!-- Componente (interface) - top center -->
  <rect x="225" y="50" width="220" height="46" fill="#ede9fe" stroke="#64748b" stroke-width="1.5"/>
